<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Manager</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 { margin: 0 0 16px; }
        h2 { margin: 28px 0 12px; }

        /* Form */
        form {
            background: #fff;
            padding: 20px;
            border: 1px solid #ddd;
        }

        form div { margin-bottom: 14px; }

        label { display: block; margin-bottom: 4px; font-weight: bold; }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #bbb;
            border-radius: 4px;
            font-size: 14px;
        }

        /* Buttons */
        .btn {
            padding: 9px 16px;
            background: #2f5d8a;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn:hover { background: #244a6e; }

        .btn-delete { padding: 5px 10px; background: #c0392b; }
        .btn-delete:hover { background: #962d22; }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }

        th, td {
            padding: 10px 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th { background: #2f5d8a; color: #fff; }

        .empty { text-align: center; color: #777; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add Student</h1>
        <form id="student-form">
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div>
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" min="1" required>
            </div>
            <div>
                <label for="roll">Roll No:</label>
                <input type="number" id="roll" name="roll" min="1" required>
            </div>
            <button type="submit" class="btn">Add Student</button>
        </form>

        <h2>Student Data</h2>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Roll No</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="student"></tbody>
        </table>
    </div>

    <script>
        const tbody = document.getElementById("student");
        const form = document.getElementById("student-form");

        // Load saved students (falls back to empty list)
        let students = [];
        try {
            students = JSON.parse(localStorage.getItem("students")) || [];
        } catch (e) {
            students = [];
        }

        function save() {
            try {
                localStorage.setItem("students", JSON.stringify(students));
            } catch (e) { /* storage unavailable */ }
        }

        function render() {
            tbody.innerHTML = "";

            if (students.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty">No students yet</td></tr>';
                return;
            }

            students.forEach((s, i) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td></td>
                    <td>${s.age}</td>
                    <td>${s.roll}</td>
                    <td><button class="btn btn-delete" data-index="${i}">Delete</button></td>
                `;
                tr.children[0].textContent = s.name; // safe from HTML injection
                tbody.appendChild(tr);
            });
        }

        // Add a student
        form.addEventListener("submit", (e) => {
            e.preventDefault();
            students.push({
                name: form.name.value.trim(),
                age: form.age.value,
                roll: form.roll.value
            });
            save();
            render();
            form.reset();
        });

        // Delete a student
        tbody.addEventListener("click", (e) => {
            if (e.target.matches(".btn-delete")) {
                students.splice(Number(e.target.dataset.index), 1);
                save();
                render();
            }
        });

        render();
    </script>
</body>
</html>
